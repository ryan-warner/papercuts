<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>papercuts — cut the small stuff</title>
<meta name="description" content="papercuts records avoidable friction that AI agents and developers encounter while working in software projects. One user-level SQLite database, grouped by repository.">
<style>
  :root {
    --bg: #0a0f0b;
    --panel: #0d1410;
    --green: #42f06b;
    --green-soft: #9fdcb0;
    --amber: #ffc266;
    --text: #b9d8c2;
    --muted: #6e8a78;
    --border: #24382b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--mono);
  }
  /* CRT scanlines + vignette */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 9;
    pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px);
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 8;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.5) 100%);
  }
  ::selection { background: var(--green); color: #06140a; }
  a { color: var(--green); text-decoration: none; border-bottom: 1px dotted var(--border); }
  a:hover { border-bottom-style: solid; text-shadow: 0 0 8px rgba(66,240,107,.5); }

  .layout {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 4rem;
  }
  .intro { max-width: 24rem; }
  .wordmark {
    color: var(--green); font-size: 2.4rem; font-weight: normal;
    letter-spacing: .06em; margin: 0;
    text-shadow: 0 0 12px rgba(66,240,107,.45), 0 0 40px rgba(66,240,107,.15);
    white-space: nowrap;
  }
  .cursor {
    display: inline-block; width: .55em; height: 1.05em;
    background: var(--green); vertical-align: baseline;
    transform: translateY(.12em);
    animation: blink 1.1s steps(1) infinite;
    box-shadow: 0 0 8px rgba(66,240,107,.6);
  }
  @keyframes blink { 50% { opacity: 0; } }
  .tagline { color: var(--green-soft); margin: .9rem 0 2rem; }
  .facts { color: var(--muted); font-size: .85rem; margin: 1.5rem 0 2.2rem; }
  .facts span { color: var(--amber); }

  .install {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex; align-items: center; gap: .9rem;
    padding: .8rem 1rem;
    box-shadow: 0 0 24px rgba(66,240,107,.05);
  }
  .install code { color: var(--green-soft); font-size: .85rem; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .ps1 { color: var(--amber); }

  button.copy {
    font: inherit; font-size: .78rem;
    background: transparent; color: var(--green);
    border: 1px solid var(--border); border-radius: 3px;
    padding: .25rem .65rem; cursor: pointer;
    flex-shrink: 0;
  }
  button.copy:hover { border-color: var(--green); box-shadow: 0 0 10px rgba(66,240,107,.25); }
  button.copy.done { color: var(--amber); border-color: var(--amber); }

  .links { font-size: .85rem; color: var(--muted); }
  .links a { margin-right: 1.1rem; }

  .terminal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    width: min(30rem, 44vw);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 34px rgba(66,240,107,.07);
  }
  .terminal-bar {
    display: flex; align-items: center; gap: .5rem;
    padding: .55rem .9rem;
    border-bottom: 1px solid var(--border);
    color: var(--muted); font-size: .78rem;
  }
  .dot { width: .68rem; height: .68rem; border-radius: 50%; display: inline-block; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .terminal-bar .title { margin-left: .4rem; }
  .replay { font-size: .78rem; color: var(--muted); margin-left: auto; }
  .replay:hover { color: var(--green); }
  .term-body {
    padding: 1rem 1.1rem 1.1rem;
    min-height: 12.5rem;
    font-size: .85rem;
  }
  .term-body .line { white-space: pre-wrap; word-break: break-word; }
  .term-body .out { color: var(--green-soft); white-space: pre-wrap; }
  .term-body .cursor { width: .5em; height: .95em; }

  @media (max-width: 52rem), (max-height: 26rem) {
    html, body { height: auto; overflow: auto; }
    .layout { flex-direction: column; gap: 2.5rem; padding: 2.5rem 1.25rem; }
    .terminal { width: min(30rem, 100%); }
    .wordmark { font-size: 1.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="layout">

  <div class="intro">
    <h1 class="wordmark">papercuts<span class="cursor"></span></h1>
    <p class="tagline">Track it now. Fix it later.</p>

    <div class="install">
      <code><span class="ps1">$</span> curl -fsSL https://ryan-warner.github.io/papercuts/install.sh | sh</code>
      <button class="copy" data-copy="curl -fsSL https://ryan-warner.github.io/papercuts/install.sh | sh">[ copy ]</button>
    </div>

    <p class="facts">one binary <span>·</span> sqlite <span>·</span> zero config <span>·</span> built for agents</p>

    <p class="links">
      <a href="https://github.com/ryan-warner/papercuts">source</a>
      <a href="docs/commands.html">docs</a>
      <a href="https://github.com/ryan-warner/papercuts/releases">releases</a>
    </p>
  </div>

  <div class="terminal">
    <div class="terminal-bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">papercuts — zsh</span>
      <a href="#" class="replay" id="replay">[ replay ]</a>
    </div>
    <div class="term-body" id="term"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  var steps = [
    {
      cmd: 'papercuts add "Prod root creds are pinned in Slack"',
      out: ["Recorded papercut #7 in papercuts"]
    },
    {
      cmd: "papercuts list",
      out: [
        "ID  STATUS  AGE    OBSERVATION",
        "7   open    now    Prod root creds are pinned in Slack",
        "6   open    1d     Every engineer has prod DB admin",
        "5   open    1826d  The intern dropped prod in 2021"
      ]
    },
    {
      cmd: "papercuts resolve 5",
      out: ["Resolved 1 papercut(s)"]
    }
  ];

  var term = document.getElementById("term");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function promptLine() {
    var line = el("div", "line");
    line.appendChild(el("span", "ps1", "$"));
    line.appendChild(document.createTextNode(" "));
    var typed = el("span", "typed");
    var cursor = el("span", "cursor");
    line.appendChild(typed);
    line.appendChild(cursor);
    term.appendChild(line);
    return { typed: typed, cursor: cursor };
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function run() {
    term.textContent = "";

    if (reduced) {
      steps.forEach(function (step) {
        var line = promptLine();
        line.typed.textContent = step.cmd;
        line.cursor.remove();
        term.appendChild(el("div", "out", step.out.join("\n")));
      });
      promptLine();
      return;
    }

    (async function () {
      for (var i = 0; i < steps.length; i++) {
        var current = promptLine();
        var cmd = steps[i].cmd;
        for (var c = 0; c < cmd.length; c++) {
          current.typed.textContent += cmd.charAt(c);
          await sleep(14 + Math.random() * 22);
        }
        current.cursor.remove();
        term.appendChild(el("div", "out", steps[i].out.join("\n")));
        await sleep(420);
      }
      promptLine();
    })();
  }

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { run(); io.disconnect(); }
      });
    }, { threshold: 0.4 });
    io.observe(term);
  } else {
    run();
  }

  document.getElementById("replay").addEventListener("click", function (event) {
    event.preventDefault();
    run();
  });

  document.querySelectorAll("button.copy").forEach(function (button) {
    button.addEventListener("click", function () {
      var text = button.getAttribute("data-copy");
      function done() {
        button.textContent = "[ copied ]";
        button.classList.add("done");
        setTimeout(function () {
          button.textContent = "[ copy ]";
          button.classList.remove("done");
        }, 1600);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        ta.remove();
        done();
      }
    });
  });
})();
</script>
</body>
</html>
